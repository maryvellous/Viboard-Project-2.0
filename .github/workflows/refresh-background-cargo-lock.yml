name: Refresh background standby Cargo lock

on:
  push:
    branches:
      - background-standby
    paths:
      - ".github/workflows/refresh-background-cargo-lock.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: background-standby

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Cargo.lock
        working-directory: packages/app/src-tauri
        run: cargo generate-lockfile

      - name: Commit Cargo.lock
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/app/src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already current."
            exit 0
          fi
          git commit -m "release: refresh Cargo lock for background standby"
          git push origin HEAD:background-standby
