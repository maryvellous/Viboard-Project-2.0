<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Background gradient: canvas → card → sidebar purple -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1e1333"/>
      <stop offset="55%"  stop-color="#2b1c47"/>
      <stop offset="100%" stop-color="#6B5887"/>
    </linearGradient>

    <!-- Text gradient (updated): terracotta → lavender → blue -->
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#8F5A5A"/>
      <stop offset="50%"  stop-color="#9D85C6"/>
      <stop offset="100%" stop-color="#A5C4DC"/>
    </linearGradient>

    <!-- Clip to rounded rect so bubbles don't bleed out -->
    <clipPath id="clip">
      <rect width="500" height="500" rx="18"/>
    </clipPath>

    <!-- Soft blob blur -->
    <filter id="bblur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <!-- Subtle text glow -->
    <filter id="textglow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes lavalamp {
        0%   { transform: translateY(0px)    scale(1);    opacity: 0; }
        8%   {                                            opacity: 1; }
        30%  { transform: translateY(-130px) scale(1.15); }
        55%  { transform: translateY(-270px) scale(0.9);  }
        75%  { transform: translateY(-400px) scale(1.2);  }
        88%  {                                            opacity: 0.6; }
        100% { transform: translateY(-600px) scale(0.8);  opacity: 0; }
      }

      .bubble { animation: lavalamp linear infinite; }

      .b1 { animation-duration: 12s; animation-delay:  0s;   }
      .b2 { animation-duration: 15s; animation-delay: -3.5s; }
      .b3 { animation-duration: 18s; animation-delay: -7s;   }
      .b4 { animation-duration: 11s; animation-delay: -1.5s; }
      .b5 { animation-duration: 14s; animation-delay: -9s;   }
      .b6 { animation-duration: 16s; animation-delay: -5s;   }
      .b7 { animation-duration: 13s; animation-delay: -2s;   }
      .b8 { animation-duration: 17s; animation-delay: -6s;   }
    </style>
  </defs>

  <!-- Base background -->
  <rect width="500" height="500" fill="url(#bgGrad)" rx="18"/>

  <!-- ── Lava Lamp Bubble Layer ── -->
  <g clip-path="url(#clip)" filter="url(#bblur)">
    <ellipse class="bubble b1" cx="60"  cy="550" rx="65" ry="60" fill="rgba(122,63,103,0.55)"/>
    <ellipse class="bubble b2" cx="275" cy="520" rx="45" ry="40" fill="rgba(157,133,198,0.45)"/>
    <ellipse class="bubble b3" cx="150" cy="580" rx="80" ry="75" fill="rgba(107,88,135,0.50)"/>
    <ellipse class="bubble b4" cx="350" cy="510" rx="35" ry="30" fill="rgba(165,196,220,0.35)"/>
    <ellipse class="bubble b5" cx="225" cy="540" rx="55" ry="50" fill="rgba(152,167,138,0.40)"/>
    <ellipse class="bubble b6" cx="100" cy="500" rx="30" ry="28" fill="rgba(143,90,90,0.40)"/>
    <ellipse class="bubble b7" cx="420" cy="535" rx="55" ry="50" fill="rgba(122,63,103,0.38)"/>
    <ellipse class="bubble b8" cx="470" cy="515" rx="40" ry="38" fill="rgba(157,133,198,0.32)"/>
  </g>

  <!-- Top-edge shimmer line -->
  <rect x="0" y="0" width="500" height="1" rx="1" fill="rgba(255,255,255,0.12)"/>

  <!-- Bottom accent line — lavender -->
  <rect x="0" y="498" width="500" height="2" rx="1" fill="rgba(157,133,198,0.45)"/>

  <!-- ── Central V ── -->
  <text
    x="250" y="250"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
    font-size="280"
    font-weight="900"
    fill="url(#textGrad)"
    filter="url(#textglow)">V</text>

</svg>
