name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Generate native app icons
        run: npm run icons -w @desk/app

      - name: Dependency audit
        shell: bash
        run: npm audit --omit=dev || true

      - name: Verify release version matches tag
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          TAURI_VERSION=$(node -p "require('./packages/app/src-tauri/tauri.conf.json').version")
          APP_VERSION=$(node -p "require('./packages/app/package.json').version")
          CORE_VERSION=$(node -p "require('./packages/core/package.json').version")
          SERVER_VERSION=$(node -p "require('./packages/server/package.json').version")

          if [ "$TAG" != "$TAURI_VERSION" ] || [ "$TAG" != "$APP_VERSION" ] || \
             [ "$TAG" != "$CORE_VERSION" ] || [ "$TAG" != "$SERVER_VERSION" ]; then
            echo "Version mismatch! tag=$TAG tauri=$TAURI_VERSION app=$APP_VERSION core=$CORE_VERSION server=$SERVER_VERSION"
            exit 1
          fi

      - name: Build and publish Windows release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/app
          tagName: ${{ github.ref_name }}
          releaseName: "Diaspro Viboard ${{ github.ref_name }}"
          releaseBody: |
            Diaspro Viboard for Windows x64.

            See README.md and RELEASE_CHECKLIST.md for supported platforms and release notes.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
