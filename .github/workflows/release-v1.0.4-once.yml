name: Tag v1.0.4 once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "$VERSION" = "1.0.4"

      - name: Create v1.0.4 tag
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin refs/tags/v1.0.4 >/dev/null 2>&1; then
            echo "v1.0.4 already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag v1.0.4
          git push origin v1.0.4
