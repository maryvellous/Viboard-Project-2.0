name: Release v0.10.0 Windows Preview

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-v0.10.0-preview.yml"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Verify v0.10.0 versions
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const files = [
            "packages/app/src-tauri/tauri.conf.json",
            "packages/app/package.json",
            "packages/core/package.json",
            "packages/server/package.json",
          ];
          for (const file of files) {
            const version = JSON.parse(fs.readFileSync(file, "utf8")).version;
            if (version !== "0.10.0") {
              throw new Error(`${file} has version ${version}, expected 0.10.0`);
            }
          }
          NODE

      - name: Disable updater artifacts for local preview
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const path = "packages/app/src-tauri/tauri.conf.json";
          const config = JSON.parse(fs.readFileSync(path, "utf8"));
          config.bundle.createUpdaterArtifacts = false;
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n");
          NODE

      - name: Build and publish Windows preview
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/app
          tagName: v0.10.0
          releaseName: "Diaspro Viboard v0.10.0 Preview"
          releaseBody: |
            Preview Windows installabile di Diaspro Viboard per test locale.
            Auto-updater disabilitato in questa build di prova.
          releaseDraft: false
          prerelease: true
