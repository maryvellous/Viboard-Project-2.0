name: Release Windows

on:
  push:
    branches:
      - "release-trigger/v1.0.3"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Generate native app icons
        run: npm run icons -w @desk/app

      - name: Dependency audit
        shell: bash
        run: npm audit --omit=dev || true

      - name: Verify release version
        shell: bash
        run: |
          EXPECTED_VERSION="1.0.3"
          ROOT_VERSION=$(node -p "require('./package.json').version")
          TAURI_VERSION=$(node -p "require('./packages/app/src-tauri/tauri.conf.json').version")
          APP_VERSION=$(node -p "require('./packages/app/package.json').version")
          CORE_VERSION=$(node -p "require('./packages/core/package.json').version")
          SERVER_VERSION=$(node -p "require('./packages/server/package.json').version")
          CARGO_VERSION=$(node -e "const fs=require('fs'); const m=fs.readFileSync('packages/app/src-tauri/Cargo.toml','utf8').match(/^version = \"([^\"]+)\"/m); if(!m) process.exit(2); process.stdout.write(m[1]);")

          if [ "$EXPECTED_VERSION" != "$ROOT_VERSION" ] || [ "$EXPECTED_VERSION" != "$TAURI_VERSION" ] || \
             [ "$EXPECTED_VERSION" != "$APP_VERSION" ] || [ "$EXPECTED_VERSION" != "$CORE_VERSION" ] || \
             [ "$EXPECTED_VERSION" != "$SERVER_VERSION" ] || [ "$EXPECTED_VERSION" != "$CARGO_VERSION" ]; then
            echo "Version mismatch! expected=$EXPECTED_VERSION root=$ROOT_VERSION tauri=$TAURI_VERSION app=$APP_VERSION core=$CORE_VERSION server=$SERVER_VERSION cargo=$CARGO_VERSION"
            exit 1
          fi

      - name: Build and publish Windows release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/app
          tagName: "v1.0.3"
          releaseName: "Diaspro Viboard v1.0.3"
          releaseCommitish: "1afa8a449c2cbc2026f99935add3eee962cfe068"
          releaseBody: |
            Diaspro Viboard 1.0.3 for Windows x64.

            - Tipografia dell'interfaccia riallineata all'identità Diaspro: Inter per testo e UI, Outfit per titoli, JetBrains Mono per microcopy tecnico.
            - Le card dei progetti usano ora i sei colori accent Diaspro in modo stabile per progetto.
            - Corretta una collisione CSS che forzava visivamente le card progetto sul viola predefinito.

            I dati restano local-first. Windows 10/11 x64 è la piattaforma ufficialmente supportata.
          releaseDraft: false
          prerelease: false
