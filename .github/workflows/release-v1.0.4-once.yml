name: Release v1.0.4 Windows once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "$VERSION" = "1.0.4"

      - name: Ensure v1.0.4 tag exists
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin refs/tags/v1.0.4 >/dev/null 2>&1; then
            echo "v1.0.4 already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag v1.0.4
          git push origin v1.0.4

  release-windows:
    needs: tag
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Generate native app icons
        run: npm run icons -w @desk/app

      - name: Verify release version
        shell: bash
        run: |
          ROOT_VERSION=$(node -p "require('./package.json').version")
          TAURI_VERSION=$(node -p "require('./packages/app/src-tauri/tauri.conf.json').version")
          APP_VERSION=$(node -p "require('./packages/app/package.json').version")
          CORE_VERSION=$(node -p "require('./packages/core/package.json').version")
          SERVER_VERSION=$(node -p "require('./packages/server/package.json').version")
          CARGO_VERSION=$(node -e "const fs=require('fs'); const m=fs.readFileSync('packages/app/src-tauri/Cargo.toml','utf8').match(/^version = \"([^\"]+)\"/m); if(!m) process.exit(2); process.stdout.write(m[1]);")
          test "$ROOT_VERSION" = "1.0.4"
          test "$TAURI_VERSION" = "1.0.4"
          test "$APP_VERSION" = "1.0.4"
          test "$CORE_VERSION" = "1.0.4"
          test "$SERVER_VERSION" = "1.0.4"
          test "$CARGO_VERSION" = "1.0.4"

      - name: Build and publish Windows release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/app
          tagName: v1.0.4
          releaseName: "Diaspro Viboard v1.0.4"
          releaseBody: |
            Diaspro Viboard 1.0.4 for Windows x64.

            Startup performance improvements:
            - single local filesystem bootstrap
            - AI maintenance moved out of the first-paint path
            - search indexing deferred until after the first interactive frame
            - native icons no longer regenerated on every tauri:dev launch
          releaseDraft: false
          prerelease: false
