name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout Viboard
        uses: actions/checkout@v4

      - name: Checkout Diaspro Installer
        uses: actions/checkout@v4
        with:
          repository: maryvellous/diaspro-installer
          path: .diaspro-installer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Generate native app icons
        run: npm run icons -w @desk/app

      - name: Dependency audit
        shell: bash
        run: npm audit --omit=dev || true

      - name: Verify release version matches tag
        id: meta
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          ROOT_VERSION=$(node -p "require('./package.json').version")
          TAURI_VERSION=$(node -p "require('./packages/app/src-tauri/tauri.conf.json').version")
          APP_VERSION=$(node -p "require('./packages/app/package.json').version")
          CORE_VERSION=$(node -p "require('./packages/core/package.json').version")
          SERVER_VERSION=$(node -p "require('./packages/server/package.json').version")
          CARGO_VERSION=$(node -e "const fs=require('fs'); const m=fs.readFileSync('packages/app/src-tauri/Cargo.toml','utf8').match(/^version = \"([^\"]+)\"/m); if(!m) process.exit(2); process.stdout.write(m[1]);")

          if [ "$TAG" != "$ROOT_VERSION" ] || [ "$TAG" != "$TAURI_VERSION" ] || \
             [ "$TAG" != "$APP_VERSION" ] || [ "$TAG" != "$CORE_VERSION" ] || \
             [ "$TAG" != "$SERVER_VERSION" ] || [ "$TAG" != "$CARGO_VERSION" ]; then
            echo "Version mismatch! tag=$TAG root=$ROOT_VERSION tauri=$TAURI_VERSION app=$APP_VERSION core=$CORE_VERSION server=$SERVER_VERSION cargo=$CARGO_VERSION"
            exit 1
          fi

          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build raw Windows executable
        working-directory: packages/app
        run: npx tauri build --no-bundle

      - name: Prepare Diaspro Installer payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ".release-payload" | Out-Null
          $exe = Get-ChildItem "packages\app\src-tauri\target\release" -Filter "*.exe" -File | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { throw "Eseguibile Viboard raw non trovato." }
          Copy-Item $exe.FullName ".release-payload\Diaspro Viboard.exe"

      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-7.1.0-x64.exe"
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe" -OutFile $installer
          $actualHash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          $expectedHash = "0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f"
          if ($actualHash -ne $expectedHash) { throw "Inno Setup SHA256 mismatch: $actualHash" }
          $process = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installer exited with code $($process.ExitCode)" }

      - name: Build Diaspro installer
        shell: pwsh
        run: .\.diaspro-installer\build.ps1 -ConfigPath ".\diaspro-installer.json" -Version "${{ steps.meta.outputs.version }}"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $tag = "${{ github.ref_name }}"
          $asset = Get-Item ".\dist-installer\Diaspro-Viboard-$version-Setup.exe"
          $notes = "Diaspro Viboard for Windows x64.`n`nInstaller generato con Diaspro Installer."

          $null = gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset.FullName --clobber
          } else {
            gh release create $tag $asset.FullName --title "Diaspro Viboard $tag" --notes $notes
          }
