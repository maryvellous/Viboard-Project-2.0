name: Refresh v1 Cargo lock

on:
  push:
    branches:
      - release-v1.0.0
    paths:
      - ".github/workflows/refresh-v1-cargo-lock.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-v1.0.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Placeholder frontend dist
        run: mkdir -p packages/app/dist && echo '<!doctype html><title>lock</title>' > packages/app/dist/index.html

      - name: Refresh Cargo.lock
        working-directory: packages/app/src-tauri
        run: cargo check

      - name: Commit Cargo.lock
        shell: bash
        run: |
          if git diff --quiet -- packages/app/src-tauri/Cargo.lock; then
            echo "Cargo.lock already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/app/src-tauri/Cargo.lock
          git commit -m "release: refresh Cargo lock for 1.0.0"
          git push origin HEAD:release-v1.0.0
