name: Release v0.10.0 Preview

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-v0.10.0-preview.yml"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify v0.10.0 versions
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const files = [
            "packages/app/src-tauri/tauri.conf.json",
            "packages/app/package.json",
            "packages/core/package.json",
            "packages/server/package.json",
          ];
          for (const file of files) {
            const version = JSON.parse(fs.readFileSync(file, "utf8")).version;
            if (version !== "0.10.0") {
              throw new Error(`${file} has version ${version}, expected 0.10.0`);
            }
          }
          NODE

      - name: Disable updater artifacts for unsigned preview
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const path = "packages/app/src-tauri/tauri.conf.json";
          const config = JSON.parse(fs.readFileSync(path, "utf8"));
          config.bundle.createUpdaterArtifacts = false;
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n");
          NODE

      - name: Build and publish preview
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/app
          tagName: v0.10.0
          releaseName: "Diaspro Viboard v0.10.0 Preview"
          releaseBody: |
            Prima preview installabile di Diaspro Viboard.

            Include il rebranding Diaspro Viboard, il nuovo data root ~/Viboard e il checkpoint CI completo.
            Gli artefatti dell'auto-updater sono intenzionalmente esclusi da questa preview finché non viene configurata una chiave di firma Tauri propria.
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
