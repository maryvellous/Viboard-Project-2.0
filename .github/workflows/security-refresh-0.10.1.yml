name: Security refresh 0.10.1

on:
  push:
    branches:
      - security-v0.10.1

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security-v0.10.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply security dependency updates
        run: npm audit fix --force || true

      - name: Block remaining high vulnerabilities
        run: npm audit --audit-level=high

      - name: Validate updated dependency tree
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Commit dependency refresh
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json packages/app/package.json packages/core/package.json packages/server/package.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "security: refresh dependencies for 0.10.1"
          git push origin HEAD:security-v0.10.1
