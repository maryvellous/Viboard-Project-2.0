name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - release

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Generate native app icons
        run: npm run icons -w @desk/app

      - name: Security audit
        run: |
          npm audit --audit-level=high

      - name: Verify release version
        shell: bash
        run: |
          TAURI_VERSION=$(jq -r '.version' packages/app/src-tauri/tauri.conf.json)
          APP_VERSION=$(jq -r '.version' packages/app/package.json)
          CORE_VERSION=$(jq -r '.version' packages/core/package.json)
          SERVER_VERSION=$(jq -r '.version' packages/server/package.json)

          if [ "$TAURI_VERSION" != "$APP_VERSION" ] || \
             [ "$TAURI_VERSION" != "$CORE_VERSION" ] || [ "$TAURI_VERSION" != "$SERVER_VERSION" ]; then
            echo "Version mismatch! tauri.conf.json: $TAURI_VERSION, app: $APP_VERSION, core: $CORE_VERSION, server: $SERVER_VERSION"
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG=${GITHUB_REF#refs/tags/v}
            if [ "$TAG" != "$TAURI_VERSION" ]; then
              echo "Tag v$TAG does not match app version $TAURI_VERSION"
              exit 1
            fi
          fi

          echo "Release version $TAURI_VERSION is consistent across all packages."

      - name: Build & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: packages/app
          tagName: "v__VERSION__"
          releaseName: "Diaspro Viboard v__VERSION__"
          releaseBody: "Diaspro Viboard v__VERSION__. See the attached installers and packages."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
