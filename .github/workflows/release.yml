name: Release Windows

on:
  push:
    branches:
      - release
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Generate native app icons
        run: npm run icons -w @desk/app

      - name: Dependency audit (informational)
        shell: bash
        run: npm audit --omit=dev || true

      - name: Verify release version
        shell: bash
        run: |
          TAURI_VERSION=$(node -p "require('./packages/app/src-tauri/tauri.conf.json').version")
          APP_VERSION=$(node -p "require('./packages/app/package.json').version")
          CORE_VERSION=$(node -p "require('./packages/core/package.json').version")
          SERVER_VERSION=$(node -p "require('./packages/server/package.json').version")

          if [ "$TAURI_VERSION" != "$APP_VERSION" ] ||              [ "$TAURI_VERSION" != "$CORE_VERSION" ] || [ "$TAURI_VERSION" != "$SERVER_VERSION" ]; then
            echo "Version mismatch! tauri.conf.json: $TAURI_VERSION, app: $APP_VERSION, core: $CORE_VERSION, server: $SERVER_VERSION"
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG=${GITHUB_REF#refs/tags/v}
            if [ "$TAG" != "$TAURI_VERSION" ]; then
              echo "Tag v$TAG does not match app version $TAURI_VERSION"
              exit 1
            fi
          fi

      - name: Disable updater artifacts for local Windows release
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const path = "packages/app/src-tauri/tauri.conf.json";
          const config = JSON.parse(fs.readFileSync(path, "utf8"));
          config.bundle.createUpdaterArtifacts = false;
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n");
          NODE

      - name: Build and publish Windows release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/app
          tagName: "v__VERSION__"
          releaseName: "Diaspro Viboard v__VERSION__"
          releaseBody: |
            Windows build di Diaspro Viboard.
            Icone Viboard aggiornate, interfaccia locale-only e updater disabilitato.
          releaseDraft: false
          prerelease: true
