name: Prepare v0.10.0 Security Fix

on:
  push:
    branches:
      - security-v0.10.0
    paths:
      - ".github/workflows/release-v0.10.0-preview.yml"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve dependency graph
        run: npm install

      - name: Apply safe runtime audit fixes
        run: npm audit fix --omit=dev --audit-level=high

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Storage integration fixture
        run: npm run verify:storage

      - name: Build desktop webview
        run: npm run build

      - name: Build hosted web app
        run: npm run build:hosted -w @desk/app

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json packages/*/package.json; then
            echo "No dependency files changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json packages/*/package.json
          git commit -m "fix: refresh dependency lockfile after security updates"
          git push origin security-v0.10.0
